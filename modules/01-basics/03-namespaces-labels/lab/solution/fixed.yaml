# Исправлено: метка tier у pod приведена к селектору Service (frontend).
apiVersion: v1
kind: Pod
metadata:
  name: front-x
  labels:
    app: web
    tier: frontend
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-front
spec:
  selector:
    app: web
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
