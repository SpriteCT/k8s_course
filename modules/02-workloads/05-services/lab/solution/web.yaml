# Задания 1–3 и 5: Deployment web и четыре Service к одним и тем же pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
---
# 1. ClusterIP: стабильное имя web внутри кластера
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
---
# 2. NodePort: порт 30080 на каждом узле, проброшен kind на localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: web-np
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
# 3. Headless: без ClusterIP, DNS отдаёт адреса pod
apiVersion: v1
kind: Service
metadata:
  name: web-h
spec:
  clusterIP: None
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
---
# 5. LoadBalancer: внешний IP выдаёт cloud-provider-kind
apiVersion: v1
kind: Service
metadata:
  name: web-lb
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: http
