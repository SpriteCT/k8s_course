# client (cli) должен достучаться до server (srv) по localhost, но не может:
# это ДВА РАЗНЫХ pod, у них разные сетевые namespace.
# Соберите один pod `paired` из двух контейнеров (см. README, задание 3).
apiVersion: v1
kind: Pod
metadata:
  name: srv
spec:
  containers:
    - name: server
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: cli
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "while true; do wget -qO- -T2 http://localhost || echo 'нет связи'; sleep 5; done"]
