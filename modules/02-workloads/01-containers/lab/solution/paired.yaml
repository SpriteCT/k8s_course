# Задание 3: два контейнера в ОДНОМ pod — общая сеть, client достаёт server по localhost.
apiVersion: v1
kind: Pod
metadata:
  name: paired
spec:
  containers:
    - name: server
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
    - name: client
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
