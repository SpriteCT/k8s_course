# Исправлено: liveness бьёт на порт 80, который слушает контейнер.
apiVersion: v1
kind: Pod
metadata:
  name: api
spec:
  containers:
    - name: web
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 3
