apiVersion: v1
kind: Pod
metadata:
  name: withcar
spec:
  initContainers:
    - name: logger
      image: busybox:1.36
      restartPolicy: Always        # нативный sidecar
      command: ["sh", "-c", "while true; do echo tick; sleep 10; done"]
  containers:
    - name: app
      image: nginx:1.27-alpine
      ports:
        - containerPort: 80
