# Ярус api из shop (как в shop/base.yaml) и CronJob, который должен раз в минуту проверять его доступность.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: shop, app.kubernetes.io/component: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/part-of: shop, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: shop, app.kubernetes.io/component: api}
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=shop api ok"]
          ports: [{containerPort: 8080, name: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app.kubernetes.io/part-of: shop, app.kubernetes.io/component: api}
spec:
  selector: {app.kubernetes.io/part-of: shop, app.kubernetes.io/component: api}
  ports: [{port: 80, targetPort: http}]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-check
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: check
              image: busybox:1.36
              command: ["wget", "-qO-", "-T", "5", "http://api:8080"]
