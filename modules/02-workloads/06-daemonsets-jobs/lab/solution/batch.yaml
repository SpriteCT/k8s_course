# Задание 3: шесть кусков работы, по два одновременно, номер куска из JOB_COMPLETION_INDEX.
apiVersion: batch/v1
kind: Job
metadata:
  name: batch
spec:
  completions: 6
  parallelism: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: work
          image: busybox:1.36
          command: ["sh", "-c", "echo part $JOB_COMPLETION_INDEX done; sleep 3"]
