# Задание 4: исправленный CronJob (Deployment и Service api из start/broken.yaml не менялись).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: api-check
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never                                   # было: Always — Job его не допускает
          containers:
            - name: check
              image: busybox:1.36
              command: ["wget", "-qO-", "-T", "5", "http://api"]  # было: api:8080 — Service слушает 80
